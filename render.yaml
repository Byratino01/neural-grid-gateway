services:
  - type: web
    name: neural-grid-gateway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: CORS_ORIGIN
        sync: false