services:
  - type: web
    name: neural-grid-gateway
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: TELEMETRY_SESSION_ISSUER_KEY
        sync: false
      - key: TELEMETRY_SESSION_SIGNING_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false