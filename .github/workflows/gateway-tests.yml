name: Gateway safety tests
on:
  push:
    branches: [feature/monitor-mode-gateway-v2, feature/modular-architecture-regression-v1, feature/v88-8-chatgpt-readonly]
  pull_request:
permissions:
  contents: read
concurrency:
  group: gateway-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
